name: Secret Scanning

on:
  workflow_call:
    outputs:
      findings:
        description: Number of secret findings reported by Trivy
        value: ${{ jobs.secret-scan.outputs.findings }}
      scan-status:
        description: "Scanner result: passed, findings, or error"
        value: ${{ jobs.secret-scan.outputs.scan-status }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    outputs:
      findings: ${{ steps.summary.outputs.findings }}
      scan-status: ${{ steps.summary.outputs.scan-status }}

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: json
          output: trivy-secret-results.json
          exit-code: '0'

      - name: Add secret scan summary
        id: summary
        if: always()
        run: |
          {
            echo "## Secret Scan"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Scanner | Trivy |"
            echo "| Scan Type | Filesystem |"
            echo "| Scanners | Secret |"
            echo

            if [ ! -f trivy-secret-results.json ]; then
              echo "### Result"
              echo
              echo "Secret scan did not produce a results file."
              echo "findings=0" >> "$GITHUB_OUTPUT"
              echo "scan-status=error" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            TOTAL=$(jq '
              [
                .Results[]?.Secrets[]?
              ] | length
            ' trivy-secret-results.json)

            echo "### Findings"
            echo
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| Secrets detected | **$TOTAL** |"
            echo

            echo "findings=$TOTAL" >> "$GITHUB_OUTPUT"

            if [ "$TOTAL" -eq 0 ]; then
              echo "scan-status=passed" >> "$GITHUB_OUTPUT"
              echo "### Result"
              echo
              echo "No secrets detected."
            else
              echo "scan-status=findings" >> "$GITHUB_OUTPUT"
              echo "### Result"
              echo
              echo "Potential secrets were detected."
              echo
              echo "### Findings"
              echo
              echo "| File | Rule | Category |"
              echo "|---|---|---|"

              jq -r '
                .Results[]?
                | .Target as $target
                | .Secrets[]?
                | [
                    $target,
                    .RuleID,
                    .Category
                  ]
                | @tsv
              ' trivy-secret-results.json |
              while IFS=$'\t' read -r file rule category; do
                echo "| \`$file\` | \`$rule\` | $category |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
