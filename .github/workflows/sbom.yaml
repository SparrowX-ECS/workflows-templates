name: SBOM

on:
  workflow_call:
    inputs:
      env-params-file:
        description: Path to the ECS parameters file
        required: true
        type: string
      image-tag:
        description: Immutable image tag to inventory
        required: true
        type: string
    outputs:
      status:
        description: "SBOM result: generated or failed"
        value: ${{ jobs.sbom.outputs.status }}
      artifact-name:
        description: Name of the uploaded SBOM artifact
        value: ${{ jobs.sbom.outputs.artifact-name }}
      artifact-path:
        description: File path after the SBOM artifact is downloaded
        value: ${{ jobs.sbom.outputs.artifact-path }}

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV_PARAMS_FILE: ${{ inputs.env-params-file }}
  IMAGE_TAG: ${{ inputs.image-tag }}

jobs:
  sbom:
    name: Generate Image SBOM
    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.summary.outputs.status }}
      artifact-name: ${{ steps.summary.outputs.artifact-name }}
      artifact-path: ${{ steps.summary.outputs.artifact-path }}

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load image configuration
        run: |
          ECR_NAMESPACE=$(yq -r '.image.nameSpace' "$ENV_PARAMS_FILE")
          ECR_REPOSITORY=$(yq -r '.image.repository' "$ENV_PARAMS_FILE")
          ECR_REPOSITORY_FULL_NAME="$ECR_NAMESPACE/$ECR_REPOSITORY"
          printf 'ECR_REPOSITORY_FULL_NAME=%s\n' \
            "$ECR_REPOSITORY_FULL_NAME" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: >-
            arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image digest
        id: image
        run: |
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY_FULL_NAME" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "None" ]; then
            echo "Image was not found in ECR:"
            echo "  $ECR_REPOSITORY_FULL_NAME:$IMAGE_TAG"
            exit 1
          fi

          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          ECR_REGISTRY="${{ steps.ecr.outputs.registry }}"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"
          IMAGE_REF="$ECR_REGISTRY/$ECR_REPOSITORY_FULL_NAME@$IMAGE_DIGEST"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'

      - name: Upload SBOM artifact
        id: upload
        if: always() && hashFiles('sbom.cdx.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.image-tag }}
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Add SBOM summary
        id: summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          UPLOAD_STATUS: ${{ steps.upload.outcome }}
        run: |
          {
            echo "artifact-name=sbom-$IMAGE_TAG" >> "$GITHUB_OUTPUT"
            echo "artifact-path=sbom.cdx.json" >> "$GITHUB_OUTPUT"
            echo "## SBOM"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Generator | Trivy |"
            echo "| Format | CycloneDX JSON |"
            echo "| Image tag | $IMAGE_TAG |"

            if [ ! -f sbom.cdx.json ]; then
              echo "| Result | **Failed** |"
              echo
              echo "SBOM generation did not produce an output file."
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            if ! jq empty sbom.cdx.json; then
              echo "| Result | **Failed** |"
              echo
              echo "SBOM output is not valid JSON."
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            if [ "$UPLOAD_STATUS" != "success" ]; then
              echo "| Result | **Failed** |"
              echo
              echo "SBOM artifact upload did not succeed."
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            COMPONENT_COUNT=$(jq '[.components[]?] | length' sbom.cdx.json)
            echo "| Components | **$COMPONENT_COUNT** |"
            echo "| Result | **Generated** |"
            if [ -n "$ARTIFACT_URL" ]; then
              echo "| Artifact | [Download SBOM]($ARTIFACT_URL) |"
            else
              echo "| Artifact | sbom-$IMAGE_TAG |"
            fi
            echo "status=generated" >> "$GITHUB_OUTPUT"
          } >> "$GITHUB_STEP_SUMMARY"
