name: Security Scan

on:
  workflow_call:
    inputs:
      env-params-file:
        description: Path to the ECS parameters file
        required: true
        type: string
      image-tag:
        description: Image tag to promote
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV_PARAMS_FILE: ${{ inputs.env-params-file }}  
  IMAGE_TAG: ${{ inputs.image-tag }}

jobs:
  security-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load image configuration
        run: |
          echo "ECR_REPOSITORY_FULL_NAME=$(yq -r '.image.nameSpace' $ENV_PARAMS_FILE)/$(yq -r '.image.repository' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_FULL_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Add security scan summary
        if: always()
        run: |
          {
            echo "## Security Scan"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Scanner | Trivy |"
            echo "| ECR repository | \`$ECR_REPOSITORY_FULL_NAME\` |"
            echo "| Image tag | \`$IMAGE_TAG\` |"
            echo "| Severity threshold | \`CRITICAL,HIGH\` |"
            echo "| Unfixed vulnerabilities | Ignored |"
          } >> "$GITHUB_STEP_SUMMARY"