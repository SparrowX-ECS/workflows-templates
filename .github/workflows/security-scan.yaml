name: Security Scan

on:
  workflow_call:
    inputs:
      env-params-file:
        description: Path to the ECS parameters file
        required: true
        type: string
      image-tag:
        description: Image tag to promote
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENV_PARAMS_FILE: ${{ inputs.env-params-file }}  
  IMAGE_TAG: ${{ inputs.image-tag }}

jobs:
  security-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load image configuration
        run: |
          echo "ECR_REPOSITORY_FULL_NAME=$(yq -r '.image.nameSpace' $ENV_PARAMS_FILE)/$(yq -r '.image.repository' $ENV_PARAMS_FILE)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Exit Code is set to 0 to report findings only, 
      # which is appropriate for the project of this scope, but not advised for builds that will might be promoted later to production
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_FULL_NAME }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-results.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Add security scan summary
        if: always()
        run: |
          {
            echo "## Security Scan"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Scanner | Trivy |"
            echo "| Image | \`$ECR_REPOSITORY_FULL_NAME:$IMAGE_TAG\` |"
            echo "| Severity | CRITICAL, HIGH |"
            echo

            TOTAL=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)

            echo "### Findings"
            echo
            echo "| Severity | Count |"
            echo "|---|---:|"
            echo "| CRITICAL | $CRITICAL |"
            echo "| HIGH | $HIGH |"
            echo "| **Total** | **$TOTAL** |"
            echo

            if [ "$TOTAL" -eq 0 ]; then
              echo "### Result"
              echo
              echo "No CRITICAL or HIGH vulnerabilities found."
            else
              echo "### Vulnerabilities"
              echo
              echo "| Severity | Package | Installed | Fixed | CVE |"
              echo "|---|---|---|---|---|"

              jq -r '
                .Results[]?.Vulnerabilities[]?
                | [
                    .Severity,
                    .PkgName,
                    .InstalledVersion,
                    (.FixedVersion // "Not fixed"),
                    .VulnerabilityID
                  ]
                | @tsv
              ' trivy-results.json |
              while IFS=$'\t' read -r severity package installed fixed cve; do
                echo "| $severity | \`$package\` | \`$installed\` | \`$fixed\` | $cve |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"