name: Smoke Test

on:
  workflow_call:
    inputs:
      env-params-file:
        description: Path to the ECS parameters file
        required: true
        type: string

      base-url:
        description: Base URL of the deployed service
        required: true
        type: string

      timeout:
        description: Maximum time in seconds to wait for the service
        required: false
        default: '120'
        type: string

permissions:
  contents: read

env:
  ENV_PARAMS_FILE: ${{ inputs.env-params-file }}
  BASE_URL: ${{ inputs.base-url }}
  TIMEOUT: ${{ inputs.timeout }}

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.48.2

      - name: Load health check configuration
        run: |
          echo "SMOKE_TEST_PATH=$(yq -r '.loadBalancer.smokeTestPath' "$ENV_PARAMS_FILE")" >> "$GITHUB_ENV"

      - name: Run smoke test
        run: |
          URL="${BASE_URL%/}${SMOKE_TEST_PATH}"

          echo "Testing: $URL"
          echo "Waiting up to ${TIMEOUT}s for the service to become healthy..."

          START_TIME=$(date +%s)

          while true; do
            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --output /tmp/response.txt \
              --write-out "%{http_code}" \
              --connect-timeout 5 \
              --max-time 10 \
              "$URL" || true)

            echo "HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Smoke test passed."
              cat /tmp/response.txt
              break
            fi

            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "Smoke test failed after ${TIMEOUT}s."
              echo "Last HTTP status: $HTTP_STATUS"
              echo "Last response:"
              cat /tmp/response.txt || true
              exit 1
            fi

            echo "Service not ready. Retrying in 5 seconds..."
            sleep 5
          done

      - name: Add smoke test summary
        if: always()
        run: |
          {
            echo "## Smoke Test"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Endpoint | \`${BASE_URL}${SMOKE_TEST_PATH}\` |"
            echo "| Timeout | \`${TIMEOUT}s\` |"
            echo "| Method | \`GET\` |"
          } >> "$GITHUB_STEP_SUMMARY"